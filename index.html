<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>サヤ取り講座</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ログイン画面 */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container.hidden {
            display: none !important;
        }

        .login-box {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }

        .login-box h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .login-box .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .login-box p {
            color: #555;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            text-align: left;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 24px;
            text-align: center;
            letter-spacing: 8px;
            transition: all 0.3s;
            font-weight: bold;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .error-message {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 20px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .help-text {
            font-size: 12px;
            color: #999;
            line-height: 1.8;
        }

        /* 学習ページ */
        .learning-container {
            display: none;
        }

        .learning-container.visible {
            display: block !important;
        }

        .header {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .welcome {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .progress-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
        }

        .progress-bar-container {
            background: #e0e0e0;
            border-radius: 50px;
            height: 40px;
            overflow: hidden;
            margin-bottom: 15px;
            position: relative;
        }

        .progress-bar {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            width: 0%;
            border-radius: 50px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 16px;
        }

        .progress-text {
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .lesson-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }

        .lesson-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .lesson-card.completed {
            background: linear-gradient(135deg, #d4fc79 0%, #96e6a1 100%);
        }

        .lesson-card.disabled {
            opacity: 0.6;
            cursor: not-allowed;
            background: #f5f5f5;
        }

        .lesson-card.disabled:hover {
            transform: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .lesson-header {
            display: flex;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .lesson-checkbox {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            cursor: pointer;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .lesson-title {
            flex: 1;
            font-size: 18px;
            font-weight: 600;
            color: #333;
            line-height: 1.4;
        }

        .video-icon {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            font-size: 14px;
            margin-top: 10px;
        }

        .coming-soon-badge {
            display: inline-block;
            background: #ffc107;
            color: #333;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
        }

        .footer-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .footer-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn {
            background: #e74c3c;
            color: white;
        }

        .logout-btn:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .reset-btn {
            background: #95a5a6;
            color: white;
        }

        .reset-btn:hover {
            background: #7f8c8d;
            transform: translateY(-2px);
        }

        .last-update {
            text-align: center;
            color: white;
            font-size: 14px;
            opacity: 0.8;
        }

        /* モーダル */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #e74c3c;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            z-index: 10;
        }

        .modal-close:hover {
            background: #c0392b;
            transform: rotate(90deg);
        }

        .modal-content h2 {
            color: #667eea;
            margin-bottom: 20px;
            padding-right: 50px;
        }

        .video-container {
            width: 100%;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 10px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* レスポンシブ */
        @media (max-width: 768px) {
            .lessons-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 24px;
            }

            .login-box h1 {
                font-size: 24px;
            }

            .modal-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- ログインページ -->
    <div class="login-container" id="loginContainer">
        <div class="login-box">
            <h1>🎓 サヤ取り講座</h1>
            <p class="subtitle">アクセスコードを入力してください</p>
            <p>メールでお送りした<br><strong>5桁のアクセスコード</strong>を入力してください</p>
            
            <div class="input-group">
                <label for="accessCode">アクセスコード</label>
                <input 
                    type="text" 
                    id="accessCode" 
                    maxlength="5" 
                    placeholder="00000"
                    inputmode="numeric"
                    pattern="[0-9]*"
                >
                <div class="error-message" id="errorMessage">アクセスコードが正しくありません</div>
            </div>

            <button class="login-btn" id="loginBtn">学習開始</button>

            <div class="help-text">
                💡 アクセスコードを忘れた場合は、<br>
                ご購入時のメールをご確認いただくか、<br>
                公式LINEまでご連絡ください。
            </div>
        </div>
    </div>

    <!-- 学習ページ -->
    <div class="learning-container" id="learningContainer">
        <div class="container">
            <div class="header">
                <h1>🎓 サヤ取り講座</h1>
                <p class="welcome">一緒に学んでいきましょう！</p>
                
                <div class="progress-section">
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="progressBar">0%</div>
                    </div>
                    <p class="progress-text" id="progressText">0 / 13 レッスン完了</p>
                </div>
            </div>

            <div class="lessons-grid" id="lessonsGrid">
                <!-- レッスンカードはJavaScriptで生成 -->
            </div>

            <div class="footer-actions">
                <button class="footer-btn logout-btn" id="logoutBtn">ログアウト</button>
                <button class="footer-btn reset-btn" id="resetBtn">進捗をリセット</button>
            </div>

            <p class="last-update" id="lastUpdate"></p>
        </div>
    </div>

    <!-- 動画モーダル -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <button class="modal-close" id="closeVideoBtn">&times;</button>
            <h2 id="modalTitle"></h2>
            <div class="video-container" id="videoContainer"></div>
        </div>
    </div>

    <script>
        // 有効なアクセスコードリスト（2001〜2100の100個）
        // 有効なアクセスコードリスト（5桁ランダム・100個）
        const VALID_ACCESS_CODES = [
            '10813', '11054', '11991', '13633', '13755', '14465', '14981', '16355', '16512', '17730',
            '19596', '20835', '21775', '22212', '22260', '22870', '23407', '23416', '23982', '26157',
            '26359', '26957', '28134', '28877', '29008', '29317', '29547', '30048', '30064', '30660',
            '31117', '32273', '32876', '33470', '34077', '35647', '36067', '37433', '37804', '40185',
            '44314', '44747', '46282', '47062', '47599', '48353', '48866', '49393', '50752', '50772',
            '50843', '52496', '52596', '55794', '57235', '57649', '58831', '60172', '60487', '61970',
            '63687', '63692', '65263', '67352', '68293', '69074', '70417', '70563', '70899', '71065',
            '71275', '71597', '73566', '75152', '75572', '79055', '79757', '81590', '82606', '83567',
            '84395', '84435', '85321', '85651', '85979', '86126', '89158', '89514', '91704', '91787',
            '92156', '92691', '93446', '94229', '94926', '96307', '96363', '97046', '98513', '99983'
        ];

        // レッスンデータ
        const lessons = [
            { id: 'lesson1', title: 'レッスン1：はじめに', videoId: '1uQmXW0_xrimLPQhMfDVX5ti9KFctR0BS' },
            { id: 'lesson2', title: 'レッスン2：サヤ取りとは', videoId: '1rEOijPLVIZSqWNJXXBXopnBz9cVPU94V' },
            { id: 'lesson3', title: 'レッスン3：標準偏差・相関係数', videoId: '1zZ994fdXt0aI2QOckLpgKxwRjGKCcHTa' },
            { id: 'lesson4', title: 'レッスン4：レバレッジ', videoId: '1DMla6JpnlQ_X8xxl1Ilvc-aStG-f6gp7' },
            { id: 'lesson5', title: 'レッスン5：サヤ取りの注意点', videoId: '10aEAggtB0kH7OCr4rmUPWnm_pW3us3K-' },
            { id: 'lesson6', title: 'レッスン6：サヤ取りの実例', videoId: '186IJPDFXfgc3IU9QBacalg68-i5tZAO_' },
            { id: 'lesson7', title: 'レッスン7：サヤチャートの使い方 実践', videoId: '1btRje47HALsOTEnU4AUKI0PSaRMih91x' },
            { id: 'lesson8', title: 'レッスン8：もう1つのサヤチャートの見方', videoId: '14Sv061huFiSazndxAWqfX-p4M5to0qpC' },
            { id: 'lesson9', title: 'レッスン9：チャートから見るエネルギーの法則', videoId: '1g5cFj_z5fCScsU2Krf9jNfMf2wgl7YgJ' },
            { id: 'lesson10', title: 'レッスン10：ボリンジャーバンドについて', videoId: '1DlrIK9erirab9tOn2QmbHQz81musqVdl' },
            { id: 'lesson11', title: 'レッスン11：金属のサヤ取り', videoId: '1nY3GwkQ37uYs-u357XnyvFlhATIMT8zh' },
            { id: 'lesson12', title: 'レッスン12：うねり取り', videoId: '1PRE_FU7nmvia1Ip2IADdUXaBU1-xTFzT' },
            { id: 'lesson13', title: 'レッスン13：参考程度ですが知っているとよい指標', videoId: '1PkeUdIrsKvV3Z-N6OPOcwykHErc6oV0z' }
        ];

        // DOM要素を取得
        const loginContainer = document.getElementById('loginContainer');
        const learningContainer = document.getElementById('learningContainer');
        const accessCodeInput = document.getElementById('accessCode');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        const logoutBtn = document.getElementById('logoutBtn');
        const resetBtn = document.getElementById('resetBtn');
        const videoModal = document.getElementById('videoModal');
        const closeVideoBtn = document.getElementById('closeVideoBtn');

        // ログイン処理
        function login() {
            const accessCode = accessCodeInput.value.trim();
            
            if (VALID_ACCESS_CODES.includes(accessCode)) {
                // ログイン成功
                localStorage.setItem('isAuthenticated', 'true');
                localStorage.setItem('accessCode', accessCode);
                showLearningPage();
            } else {
                // ログイン失敗
                errorMessage.style.display = 'block';
                accessCodeInput.value = '';
                accessCodeInput.focus();
            }
        }

        // 学習ページを表示
        function showLearningPage() {
            loginContainer.classList.add('hidden');
            learningContainer.classList.add('visible');
            renderLessons();
            updateProgress();
        }

        // ログアウト
        function logout() {
            if (confirm('ログアウトしますか？\n\n※ 学習の進捗は保存されています。')) {
                localStorage.removeItem('isAuthenticated');
                localStorage.removeItem('accessCode');
                location.reload();
            }
        }

        // レッスンカードを生成
        function renderLessons() {
            const grid = document.getElementById('lessonsGrid');
            grid.innerHTML = '';

            lessons.forEach((lesson) => {
                const card = document.createElement('div');
                const isCompleted = localStorage.getItem(lesson.id) === 'true';
                const isDisabled = !lesson.videoId;

                card.className = `lesson-card ${isCompleted ? 'completed' : ''} ${isDisabled ? 'disabled' : ''}`;
                
                card.innerHTML = `
                    <div class="lesson-header">
                        <input 
                            type="checkbox" 
                            class="lesson-checkbox" 
                            id="${lesson.id}" 
                            ${isCompleted ? 'checked' : ''}
                        >
                        <div class="lesson-title">
                            ${lesson.title}
                            ${isDisabled ? '<span class="coming-soon-badge">準備中</span>' : ''}
                        </div>
                    </div>
                    ${!isDisabled ? '<div class="video-icon">🎬 動画を見る</div>' : ''}
                `;

                // チェックボックスのイベント
                const checkbox = card.querySelector('.lesson-checkbox');
                checkbox.addEventListener('change', function(e) {
                    e.stopPropagation();
                    toggleLesson(lesson.id);
                });

                // カードクリックで動画再生
                if (!isDisabled) {
                    card.addEventListener('click', function(e) {
                        if (e.target.type !== 'checkbox') {
                            openVideo(lesson.id, lesson.title, lesson.videoId);
                        }
                    });
                }

                grid.appendChild(card);
            });
        }

        // レッスンチェック切り替え
        function toggleLesson(lessonId) {
            const checkbox = document.getElementById(lessonId);
            const isChecked = checkbox.checked;
            localStorage.setItem(lessonId, isChecked);
            localStorage.setItem('lastUpdate', new Date().toLocaleString('ja-JP'));
            
            renderLessons();
            updateProgress();
        }

        // 進捗を更新
        function updateProgress() {
            const totalLessons = lessons.length;
            let completedLessons = 0;

            lessons.forEach(lesson => {
                if (localStorage.getItem(lesson.id) === 'true') {
                    completedLessons++;
                }
            });

            const percentage = Math.round((completedLessons / totalLessons) * 100);
            
            document.getElementById('progressBar').style.width = percentage + '%';
            document.getElementById('progressBar').textContent = percentage + '%';
            document.getElementById('progressText').textContent = `${completedLessons} / ${totalLessons} レッスン完了`;

            const lastUpdate = localStorage.getItem('lastUpdate');
            if (lastUpdate) {
                document.getElementById('lastUpdate').textContent = `最終更新: ${lastUpdate}`;
            }

            // 全レッスン完了時
            if (completedLessons === totalLessons) {
                setTimeout(() => {
                    alert('🎉 おめでとうございます！\n\n学習が完了しました！');
                }, 500);
            }
        }

        // 動画を開く
        function openVideo(lessonId, title, videoId) {
            const modalTitle = document.getElementById('modalTitle');
            const videoContainer = document.getElementById('videoContainer');

            modalTitle.textContent = title;
            
            videoContainer.innerHTML = `
                <iframe 
                    src="https://drive.google.com/file/d/${videoId}/preview" 
                    allow="autoplay; fullscreen"
                    allowfullscreen
                ></iframe>
            `;

            videoModal.classList.add('active');
        }

        // 動画を閉じる
        function closeVideo() {
            const videoContainer = document.getElementById('videoContainer');
            videoModal.classList.remove('active');
            videoContainer.innerHTML = '';
        }

        // 進捗をリセット
        function resetProgress() {
            if (confirm('進捗をリセットしますか？\n\n※ すべてのチェックが解除されます。')) {
                lessons.forEach(lesson => {
                    localStorage.removeItem(lesson.id);
                });
                localStorage.removeItem('lastUpdate');
                renderLessons();
                updateProgress();
            }
        }

        // イベントリスナー設定
        loginBtn.addEventListener('click', login);
        
        accessCodeInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                login();
            }
        });

        accessCodeInput.addEventListener('input', function(e) {
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        logoutBtn.addEventListener('click', logout);
        resetBtn.addEventListener('click', resetProgress);
        closeVideoBtn.addEventListener('click', closeVideo);

        // 初期化
        window.addEventListener('DOMContentLoaded', function() {
            const isAuthenticated = localStorage.getItem('isAuthenticated') === 'true';
            
            if (isAuthenticated) {
                showLearningPage();
            }
        });
    </script>
</body>
</html>
